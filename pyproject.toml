[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cartografo"
version = "0.1.0"
description = "Pipeline modular de extração, armazenamento e sumarização de cartas de gestores."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pdfplumber>=0.11",
    "python-dateutil>=2.9",
    "SQLAlchemy>=2.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "APScheduler>=3.10",
]

[project.optional-dependencies]
# Páginas dinâmicas (SPA/JS). Após instalar: `playwright install chromium`.
dynamic = ["playwright>=1.44"]
# OCR de PDFs escaneados (requer tesseract e poppler no sistema) + fallback rápido.
ocr = ["pytesseract>=0.3.10", "pdf2image>=1.17", "PyMuPDF>=1.24"]
# Desenvolvimento e testes.
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
cartografo = "cartografo.run:main"

[tool.setuptools.packages.find]
include = ["cartografo*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# BLE001: capturas amplas são intencionais (resiliência por fonte).
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
